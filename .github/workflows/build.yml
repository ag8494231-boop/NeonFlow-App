name: Compilar APK NeonFlow

on:
  workflow_dispatch: # Esto crea un botón para que lo ejecutes cuando quieras

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. Clonar el código
        uses: actions/checkout@v4

      - name: 2. Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Instalar dependencias del sistema (SQLite y Kivy)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3-dev ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good zip unzip libffi-dev libssl-dev autoconf automake libtool pkg-config libtool-bin m4 libunwind-dev

      - name: 4. Instalar Buildozer
        run: pip install buildozer cython==0.29.33

      - name: 5. Compilar la aplicación (Magia en proceso)
        run: buildozer android debug

      - name: 6. Entregar el APK listo
        uses: actions/upload-artifact@v4
        with:
          name: NeonFlow-APK
          path: bin/*.apk
